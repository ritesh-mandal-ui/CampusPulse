<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusPulse - Applications</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .applications-hero {
            margin-bottom: 24px;
        }

        .applications-hero h2 {
            margin-bottom: 8px;
        }

        .applications-hero p {
            margin: 0;
        }

        .application-stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .application-stat {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            border: 1px solid #e5e7eb;
        }

        .application-stat-label {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .application-stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
        }

        .applications-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .applications-toolbar-left {
            flex: 1;
            min-width: 240px;
        }

        .applications-search {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid #dbe2ea;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            background: #ffffff;
        }

        .applications-search:focus {
            border-color: #2563eb;
        }

        .applications-toolbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .application-count {
            color: #64748b;
            font-size: 14px;
            white-space: nowrap;
        }

        .refresh-button {
            border: none;
            cursor: pointer;
        }

        .applications-list {
            display: grid;
            gap: 18px;
        }

        .application-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
        }

        .application-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        .application-card-header h3 {
            margin: 0 0 6px;
            font-size: 20px;
            color: #0f172a;
        }

        .application-id {
            color: #64748b;
            font-size: 13px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-applied {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-shortlisted {
            background: #fef3c7;
            color: #92400e;
        }

        .status-interview {
            background: #ede9fe;
            color: #6d28d9;
        }

        .status-selected {
            background: #dcfce7;
            color: #166534;
        }

        .status-rejected {
            background: #fee2e2;
            color: #b91c1c;
        }

        .status-withdrawn {
            background: #f1f5f9;
            color: #475569;
        }

        .application-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 22px;
        }

        .application-detail {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px;
        }

        .application-detail-label {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .application-detail-value {
            display: block;
            color: #0f172a;
            font-size: 14px;
            font-weight: 600;
        }

        .application-status-section {
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }

        .application-status-controls {
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        .application-status-field {
            flex: 1;
        }

        .application-status-field label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
        }

        .application-status-field select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            background: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .application-status-field select:focus {
            border-color: #2563eb;
        }

        .update-status-button {
            white-space: nowrap;
        }

        .status-message {
            margin: 12px 0 0;
            font-size: 13px;
            color: #16a34a;
        }

        .applications-empty {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }

        .applications-empty h3 {
            margin: 0 0 8px;
            color: #0f172a;
        }

        .applications-empty p {
            margin: 0;
        }

        .applications-error {
            color: #dc2626;
            text-align: center;
            padding: 30px 20px;
        }

        @media (max-width: 1100px) {
            .application-stats {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 700px) {
            .application-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .application-card-header {
                flex-direction: column;
            }

            .application-details {
                grid-template-columns: 1fr;
            }

            .application-status-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .update-status-button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .application-stats {
                grid-template-columns: 1fr;
            }

            .application-card {
                padding: 17px;
            }

            .applications-toolbar-right {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard-container">

        <header class="dashboard-header">
            <div>
                <h1>CampusPulse</h1>
                <p>Application Management</p>
            </div>

            <button id="backButton" class="btn-primary">
                Back to Dashboard
            </button>
        </header>

        <main class="dashboard-content">

            <section class="welcome-card applications-hero">
                <h2>Application Management</h2>
                <p>
                    Review student applications and manage recruitment
                    progress from one central workspace.
                </p>
            </section>

            <section class="application-stats">

                <div class="application-stat">
                    <div class="application-stat-label">
                        Total Applications
                    </div>
                    <div
                        id="totalApplications"
                        class="application-stat-value"
                    >
                        0
                    </div>
                </div>

                <div class="application-stat">
                    <div class="application-stat-label">
                        Applied
                    </div>
                    <div
                        id="appliedApplications"
                        class="application-stat-value"
                    >
                        0
                    </div>
                </div>

                <div class="application-stat">
                    <div class="application-stat-label">
                        Shortlisted
                    </div>
                    <div
                        id="shortlistedApplications"
                        class="application-stat-value"
                    >
                        0
                    </div>
                </div>

                <div class="application-stat">
                    <div class="application-stat-label">
                        Interview
                    </div>
                    <div
                        id="interviewApplications"
                        class="application-stat-value"
                    >
                        0
                    </div>
                </div>

                <div class="application-stat">
                    <div class="application-stat-label">
                        Selected
                    </div>
                    <div
                        id="selectedApplications"
                        class="application-stat-value"
                    >
                        0
                    </div>
                </div>

            </section>

            <section class="dashboard-card">

                <div class="applications-toolbar">

                    <div class="applications-toolbar-left">
                        <input
                            type="search"
                            id="applicationSearch"
                            class="applications-search"
                            placeholder="Search by student, job, or company..."
                        >
                    </div>

                    <div class="applications-toolbar-right">
                        <span
                            id="applicationCount"
                            class="application-count"
                        >
                            0 applications
                        </span>

                        <button
                            id="refreshButton"
                            class="btn-primary refresh-button"
                        >
                            Refresh
                        </button>
                    </div>

                </div>

                <div
                    id="applicationsList"
                    class="applications-list"
                >
                    Loading applications...
                </div>

                <p
                    id="applicationsMessage"
                    class="message"
                ></p>

            </section>

        </main>

    </div>

    <script>
        const API_BASE_URL = "https://campuspulse-backend-uzum.onrender.com";

        const token = localStorage.getItem("token");
        const role = localStorage.getItem("role");

        if (
            !token ||
            (
                role !== "TPO" &&
                role !== "ADMIN" &&
                role !== "SUPER_ADMIN"
            )
        ) {
            window.location.href = "login.html";
        }

        let allApplications = [];

        document
            .getElementById("backButton")
            .addEventListener("click", function () {
                window.location.href =
                    "admin-dashboard.html";
            });

        document
            .getElementById("refreshButton")
            .addEventListener("click", function () {
                loadApplications();
            });

        document
            .getElementById("applicationSearch")
            .addEventListener("input", function () {
                renderApplications(this.value);
            });

        function formatApplicationDateTime(value) {
            if (!value) {
                return "Not specified";
            }

            const date = new Date(value);

            if (isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "numeric",
                minute: "2-digit",
                hour12: true
            });
        }

        function formatStatusLabel(status) {
            if (!status) {
                return "Not specified";
            }

            return status
                .toLowerCase()
                .replace(/_/g, " ")
                .replace(/\b\w/g, function (letter) {
                    return letter.toUpperCase();
                });
        }

        function getStatusClass(status) {
            if (!status) {
                return "";
            }

            return "status-" +
                status.toLowerCase().replace(/_/g, "-");
        }

        function escapeHtml(value) {
            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function updateApplicationStats(applications) {
            document.getElementById(
                "totalApplications"
            ).textContent = applications.length;

            document.getElementById(
                "appliedApplications"
            ).textContent = applications.filter(function (application) {
                return application.status === "APPLIED";
            }).length;

            document.getElementById(
                "shortlistedApplications"
            ).textContent = applications.filter(function (application) {
                return application.status === "SHORTLISTED";
            }).length;

            document.getElementById(
                "interviewApplications"
            ).textContent = applications.filter(function (application) {
                return application.status === "INTERVIEW";
            }).length;

            document.getElementById(
                "selectedApplications"
            ).textContent = applications.filter(function (application) {
                return application.status === "SELECTED";
            }).length;
        }

        function renderApplications(searchTerm) {
            const applicationsList =
                document.getElementById("applicationsList");

            const applicationCount =
                document.getElementById("applicationCount");

            const normalizedSearch =
                (searchTerm || "").trim().toLowerCase();

            const filteredApplications =
                allApplications.filter(function (application) {

                    const studentName =
                        String(
                            application.student_name || ""
                        ).toLowerCase();

                    const jobTitle =
                        String(
                            application.job_title || ""
                        ).toLowerCase();

                    const companyName =
                        String(
                            application.company_name || ""
                        ).toLowerCase();

                    return (
                        studentName.includes(normalizedSearch) ||
                        jobTitle.includes(normalizedSearch) ||
                        companyName.includes(normalizedSearch)
                    );
                });

            applicationCount.textContent =
                filteredApplications.length +
                (
                    filteredApplications.length === 1
                        ? " application"
                        : " applications"
                );

            if (filteredApplications.length === 0) {
                applicationsList.innerHTML = `
                    <div class="applications-empty">
                        <h3>
                            ${
                                normalizedSearch
                                    ? "No Matching Applications"
                                    : "No Applications Yet"
                            }
                        </h3>

                        <p>
                            ${
                                normalizedSearch
                                    ? "Try a different student, job, or company name."
                                    : "There are currently no student applications to display."
                            }
                        </p>
                    </div>
                `;

                return;
            }

            applicationsList.innerHTML = "";

            filteredApplications.forEach(function (application) {

                const applicationCard =
                    document.createElement("div");

                applicationCard.className =
                    "application-card";

                const status =
                    application.status || "";

                applicationCard.innerHTML = `
                    <div class="application-card-header">

                        <div>
                            <h3>
                                ${escapeHtml(
                                    application.job_title ||
                                    "Unknown Job"
                                )}
                            </h3>

                            <span class="application-id">
                                Application #${escapeHtml(
                                    application.application_id
                                )}
                            </span>
                        </div>

                        <span
                            class="status-badge ${getStatusClass(status)}"
                        >
                            ${escapeHtml(
                                formatStatusLabel(status)
                            )}
                        </span>

                    </div>

                    <div class="application-details">

                        <div class="application-detail">
                            <span class="application-detail-label">
                                Student
                            </span>

                            <span class="application-detail-value">
                                ${escapeHtml(
                                    application.student_name ||
                                    "Unknown"
                                )}
                            </span>
                        </div>

                        <div class="application-detail">
                            <span class="application-detail-label">
                                Company
                            </span>

                            <span class="application-detail-value">
                                ${escapeHtml(
                                    application.company_name ||
                                    "Unknown"
                                )}
                            </span>
                        </div>

                        <div class="application-detail">
                            <span class="application-detail-label">
                                Applied At
                            </span>

                            <span class="application-detail-value">
                                ${escapeHtml(
                                    formatApplicationDateTime(
                                        application.applied_at
                                    )
                                )}
                            </span>
                        </div>

                        <div class="application-detail">
                            <span class="application-detail-label">
                                Current Status
                            </span>

                            <span class="application-detail-value">
                                ${escapeHtml(
                                    formatStatusLabel(status)
                                )}
                            </span>
                        </div>

                    </div>

                    <div class="application-status-section">

                        <div class="application-status-controls">

                            <div class="application-status-field">

                                <label
                                    for="status-${application.application_id}"
                                >
                                    Update Application Status
                                </label>

                                <select
                                    id="status-${application.application_id}"
                                >
                                    <option value="APPLIED">
                                        Applied
                                    </option>

                                    <option value="SHORTLISTED">
                                        Shortlisted
                                    </option>

                                    <option value="INTERVIEW">
                                        Interview
                                    </option>

                                    <option value="SELECTED">
                                        Selected
                                    </option>

                                    <option value="REJECTED">
                                        Rejected
                                    </option>

                                    <option value="WITHDRAWN">
                                        Withdrawn
                                    </option>
                                </select>

                            </div>

                            <button
                                class="btn-primary update-status-button"
                                data-application-id="${escapeHtml(
                                    application.application_id
                                )}"
                            >
                                Update Status
                            </button>

                        </div>

                        <p
                            id="status-message-${application.application_id}"
                            class="status-message"
                        ></p>

                    </div>
                `;

                applicationsList.appendChild(
                    applicationCard
                );

                document.getElementById(
                    `status-${application.application_id}`
                ).value = application.status;
            });

            document
                .querySelectorAll(".update-status-button")
                .forEach(function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            const applicationId =
                                this.getAttribute(
                                    "data-application-id"
                                );

                            updateApplicationStatus(
                                applicationId
                            );
                        }
                    );
                });
        }

        async function loadApplications() {
            const applicationsList =
                document.getElementById("applicationsList");

            const applicationsMessage =
                document.getElementById("applicationsMessage");

            applicationsMessage.textContent = "";

            applicationsList.innerHTML =
                "Loading applications...";

            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/applications`,
                    {
                        method: "GET",
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    applicationsList.innerHTML = "";

                    applicationsMessage.textContent =
                        data.error ||
                        "Unable to load applications.";

                    return;
                }

                allApplications =
                    data.applications || [];

                updateApplicationStats(
                    allApplications
                );

                renderApplications(
                    document.getElementById(
                        "applicationSearch"
                    ).value
                );

            } catch (error) {
                applicationsList.innerHTML = `
                    <div class="applications-error">
                        Unable to connect to CampusPulse backend.
                    </div>
                `;

                applicationsMessage.textContent = "";
            }
        }

        async function updateApplicationStatus(
            applicationId
        ) {
            const status =
                document.getElementById(
                    `status-${applicationId}`
                ).value;

            const statusMessage =
                document.getElementById(
                    `status-message-${applicationId}`
                );

            statusMessage.textContent =
                "Updating status...";

            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/applications/${applicationId}/status`,
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type":
                                "application/json",
                            "Authorization":
                                `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            status: status
                        })
                    }
                );

                const data =
                    await response.json();

                if (!response.ok) {
                    statusMessage.textContent =
                        data.error ||
                        "Unable to update application status.";

                    return;
                }

                statusMessage.textContent =
                    "Application status updated successfully.";

                await loadApplications();

            } catch (error) {
                statusMessage.textContent =
                    "Unable to connect to CampusPulse backend.";
            }
        }

        loadApplications();
    </script>

</body>
</html>
