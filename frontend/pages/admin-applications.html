<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusPulse - Applications</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="dashboard-container">
        <header class="dashboard-header">
            <div>
                <h1>CampusPulse</h1>
                <p>Application Management</p>
            </div>

            <button id="backButton" class="btn-primary">
                Back to Dashboard
            </button>
        </header>

        <main class="dashboard-content">

            <section class="welcome-card">
                <h2>Applications</h2>
                <p>View and manage student job applications.</p>
            </section>

            <section class="dashboard-card">
                <h3>Application List</h3>

                <div id="applicationsList">
                    Loading applications...
                </div>

                <p id="applicationsMessage" class="message"></p>
            </section>

        </main>
    </div>

    <script>
        const API_BASE_URL = "http://127.0.0.1:5000";

        const token = localStorage.getItem("token");
        const role = localStorage.getItem("role");

        if (
            !token ||
            (
                role !== "TPO" &&
                role !== "ADMIN" &&
                role !== "SUPER_ADMIN"
            )
        ) {
            window.location.href = "login.html";
        }

        document.getElementById("backButton").addEventListener("click", function () {
            window.location.href = "admin-dashboard.html";
        });

        function formatApplicationDateTime(value) {
            if (!value) {
                return "Not specified";
            }

            const date = new Date(value);

            if (isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "numeric",
                minute: "2-digit",
                hour12: true
            });
        }

        function formatStatusLabel(status) {
            if (!status) {
                return "Not specified";
            }

            return status
                .toLowerCase()
                .replace(/_/g, " ")
                .replace(/\b\w/g, function (letter) {
                    return letter.toUpperCase();
                });
        }

        async function loadApplications() {
            const applicationsList =
                document.getElementById("applicationsList");

            const applicationsMessage =
                document.getElementById("applicationsMessage");

            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/applications`,
                    {
                        method: "GET",
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    applicationsList.textContent = "";
                    applicationsMessage.textContent =
                        data.error || "Unable to load applications.";
                    return;
                }

                if (
                    !data.applications ||
                    data.applications.length === 0
                ) {
                    applicationsList.textContent =
                        "No applications found.";
                    return;
                }

                applicationsList.innerHTML = "";

                data.applications.forEach(function (application) {
                    const applicationCard =
                        document.createElement("div");

                    applicationCard.className = "dashboard-card";
                    applicationCard.style.marginBottom = "20px";

                    applicationCard.innerHTML = `
                        <h3>
                            Application #${application.application_id}
                        </h3>

                        <p>
                            <strong>Student:</strong>
                            ${application.student_name || "Unknown"}
                        </p>

                        <p>
                            <strong>Job:</strong>
                            ${application.job_title || "Unknown"}
                        </p>

                        <p>
                            <strong>Company:</strong>
                            ${application.company_name || "Unknown"}
                        </p>

                        <p>
                            <strong>Applied At:</strong>
                            ${formatApplicationDateTime(application.applied_at)}
                        </p>

                        <div class="form-group">
                            <label
                                for="status-${application.application_id}"
                            >
                                Application Status
                            </label>

                            <select
                                id="status-${application.application_id}"
                            >
                                <option value="APPLIED">
                                    Applied
                                </option>

                                <option value="SHORTLISTED">
                                    Shortlisted
                                </option>

                                <option value="INTERVIEW">
                                    Interview
                                </option>

                                <option value="SELECTED">
                                    Selected
                                </option>

                                <option value="REJECTED">
                                    Rejected
                                </option>

                                <option value="WITHDRAWN">
                                    Withdrawn
                                </option>
                            </select>
                        </div>

                        <button
                            class="btn-primary update-status-button"
                            data-application-id="${application.application_id}"
                        >
                            Update Status
                        </button>

                        <p
                            id="status-message-${application.application_id}"
                            class="message"
                        ></p>
                    `;

                    applicationsList.appendChild(applicationCard);

                    document.getElementById(
                        `status-${application.application_id}`
                    ).value = application.status;
                });

                document
                    .querySelectorAll(".update-status-button")
                    .forEach(function (button) {
                        button.addEventListener(
                            "click",
                            function () {
                                const applicationId =
                                    this.getAttribute(
                                        "data-application-id"
                                    );

                                updateApplicationStatus(
                                    applicationId
                                );
                            }
                        );
                    });

            } catch (error) {
                applicationsList.textContent = "";

                applicationsMessage.textContent =
                    "Unable to connect to CampusPulse backend.";
            }
        }

        async function updateApplicationStatus(applicationId) {
            const status =
                document.getElementById(
                    `status-${applicationId}`
                ).value;

            const statusMessage =
                document.getElementById(
                    `status-message-${applicationId}`
                );

            statusMessage.textContent =
                "Updating status...";

            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/applications/${applicationId}/status`,
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            status: status
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    statusMessage.textContent =
                        data.error ||
                        "Unable to update application status.";
                    return;
                }

                statusMessage.textContent =
                    "Application status updated successfully.";

                loadApplications();

            } catch (error) {
                statusMessage.textContent =
                    "Unable to connect to CampusPulse backend.";
            }
        }

        loadApplications();
    </script>

</body>
</html>
