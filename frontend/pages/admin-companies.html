<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusPulse - Companies</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="dashboard-container">
        <header class="dashboard-header">
            <div>
                <h1>CampusPulse</h1>
                <p>Company Management</p>
            </div>

            <button id="backButton" class="btn-primary">
                Back to Dashboard
            </button>
        </header>

        <main class="dashboard-content">

            <section class="welcome-card">
                <h2>Companies</h2>
                <p>Manage companies participating in placements.</p>
            </section>

            <section class="dashboard-card">
                <h3>Add Company</h3>

                <div class="form-group">
                    <label for="companyName">Company Name</label>
                    <input
                        type="text"
                        id="companyName"
                        placeholder="Enter company name"
                    >
                </div>

                <div class="form-group">
                    <label for="industry">Industry</label>
                    <input
                        type="text"
                        id="industry"
                        placeholder="Enter industry"
                    >
                </div>

                <div class="form-group">
                    <label for="website">Website</label>
                    <input
                        type="text"
                        id="website"
                        placeholder="Enter company website"
                    >
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input
                        type="text"
                        id="location"
                        placeholder="Enter company location"
                    >
                </div>

                <button id="addCompanyButton" class="btn-primary">
                    Add Company
                </button>

                <p id="addCompanyMessage" class="message"></p>
            </section>

            <section class="dashboard-card">
                <h3>Company List</h3>

                <div id="companiesList">
                    Loading companies...
                </div>

                <p id="companiesMessage" class="message"></p>
            </section>

        </main>
    </div>

    <script>
        const API_BASE_URL = "http://127.0.0.1:5000";

        const token = localStorage.getItem("token");
        const role = localStorage.getItem("role");

        if (
            !token ||
            (
                role !== "TPO" &&
                role !== "ADMIN" &&
                role !== "SUPER_ADMIN"
            )
        ) {
            window.location.href = "login.html";
        }

        document.getElementById("backButton").addEventListener("click", function () {
            window.location.href = "admin-dashboard.html";
        });

        async function loadCompanies() {
            const companiesList =
                document.getElementById("companiesList");

            const companiesMessage =
                document.getElementById("companiesMessage");

            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/companies`,
                    {
                        method: "GET",
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    companiesList.textContent = "";
                    companiesMessage.textContent =
                        data.error || "Unable to load companies.";
                    return;
                }

                if (
                    !data.companies ||
                    data.companies.length === 0
                ) {
                    companiesList.textContent =
                        "No companies found.";
                    return;
                }

                companiesList.innerHTML = "";

                data.companies.forEach(function (company) {
                    const companyCard =
                        document.createElement("div");

                    companyCard.style.marginBottom = "20px";

                    companyCard.innerHTML = `
                        <h3>${company.company_name}</h3>

                        <p>
                            <strong>Industry:</strong>
                            ${company.industry || "Not specified"}
                        </p>

                        <p>
                            <strong>Website:</strong>
                            ${company.website || "Not specified"}
                        </p>

                        <p>
                            <strong>Location:</strong>
                            ${company.location || "Not specified"}
                        </p>
                    `;

                    companiesList.appendChild(companyCard);
                });

            } catch (error) {
                companiesList.textContent = "";

                companiesMessage.textContent =
                    "Unable to connect to CampusPulse backend.";
            }
        }

        document.getElementById("addCompanyButton").addEventListener(
            "click",
            async function () {

                const companyName =
                    document.getElementById("companyName").value.trim();

                const industry =
                    document.getElementById("industry").value.trim();

                const website =
                    document.getElementById("website").value.trim();

                const location =
                    document.getElementById("location").value.trim();

                const addCompanyMessage =
                    document.getElementById("addCompanyMessage");

                if (!companyName) {
                    addCompanyMessage.textContent =
                        "Company name is required.";
                    return;
                }

                addCompanyMessage.textContent =
                    "Adding company...";

                try {
                    const response = await fetch(
                        `${API_BASE_URL}/api/companies`,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": `Bearer ${token}`
                            },
                            body: JSON.stringify({
                                company_name: companyName,
                                industry: industry || null,
                                website: website || null,
                                location: location || null
                            })
                        }
                    );

                    const data = await response.json();

                    if (!response.ok) {
                        addCompanyMessage.textContent =
                            data.error || "Unable to add company.";
                        return;
                    }

                    addCompanyMessage.textContent =
                        "Company added successfully.";

                    document.getElementById("companyName").value = "";
                    document.getElementById("industry").value = "";
                    document.getElementById("website").value = "";
                    document.getElementById("location").value = "";

                    loadCompanies();

                } catch (error) {
                    addCompanyMessage.textContent =
                        "Unable to connect to CampusPulse backend.";
                }
            }
        );

        loadCompanies();
    </script>

</body>
</html>
