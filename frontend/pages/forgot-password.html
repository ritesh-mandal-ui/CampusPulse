<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusPulse - Forgot Password</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <h1>CampusPulse</h1>
            <p class="subtitle">Reset your password</p>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        required
                    >
                </div>

                <button type="submit" class="btn-primary">
                    Send Reset Link
                </button>

                <p id="forgotPasswordMessage" class="message"></p>
            </form>

            <p class="auth-link">
                Remember your password?
                <a href="login.html">Back to Login</a>
            </p>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://campuspulse-backend-uzum.onrender.com";

        const form = document.getElementById("forgotPasswordForm");
        const message = document.getElementById("forgotPasswordMessage");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();

            message.textContent = "Sending reset link...";
            message.style.color = "";

            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/auth/forgot-password`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ email })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Unable to process your request.");
                }

                message.textContent =
                    data.message ||
                    "If the email is registered, a password reset link has been sent.";

                form.reset();

            } catch (error) {
                message.textContent =
                    error.message || "Something went wrong. Please try again.";
            }
        });
    </script>

</body>
</html>
